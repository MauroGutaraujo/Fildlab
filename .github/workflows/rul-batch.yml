name: Batch de predicciones RUL

on:
  schedule:
    - cron: "0 8 * * *"  # 03:00 hora de Lima (UTC-5) = 08:00 UTC
  workflow_dispatch: {}

jobs:
  predecir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install -c constraints-ml.txt -e ".[ml]"
          python -m pip check
      # El batch valida el modelo después de registrar EN_CURSO para auditar
      # FALLIDA/MODELO_INVALIDO; no adelantar esa validación a un paso que lo omita.
      - name: Correr el batch de predicciones RUL
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          RUL_DURACION_MAX_SEGUNDOS: "600"
          RUL_LATIDO_SEGUNDOS: "15"
          RUL_SILENCIO_SEGUNDOS: "90"
        run: python -m app.ml.batch_predicciones
