name: Software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fildlab_test
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: fildlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fildlab_test -d fildlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://unused@127.0.0.1/unavailable
      DATABASE_URL_TEST: postgresql://fildlab_test:ephemeral-ci-password@127.0.0.1:5432/fildlab_test
      JWT_SECRET: ephemeral-ci-secret-not-for-production-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints-ml.txt
            backend/app/ml/recursos/constraints-ml.txt
      - run: python -m pip install -c constraints-ml.txt -e '.[dev,ml]'
      - run: python -m pip check
      - name: Validar artefacto publicado sin reentrenamiento
        run: python -c "from app.ml.artefacto_rul import cargar_modelo; print(cargar_modelo().sha256)"
      - name: Migrations on disposable PostgreSQL
        run: |
          alembic -x db_url="$DATABASE_URL_TEST" upgrade head
          alembic -x db_url="$DATABASE_URL_TEST" downgrade base
          alembic -x db_url="$DATABASE_URL_TEST" upgrade head
      - name: Backend and ML tests in private schemas
        run: python -m pytest -q

  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [frontend, pwa]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
